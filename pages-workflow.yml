name: pages

# Publie le rapport statique sur GitHub Pages.
# Seuls les fichiers publics sont deployes (pas le code ni l'etat de collecte).
# Le build "legacy" de Pages echouait sans message exploitable ; ce workflow
# deploie un dossier prepare et donne des logs lisibles en cas de probleme.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Recuperer le site
        uses: actions/checkout@v4

      - name: Preparer le dossier public
        run: |
          mkdir -p _site
          cp index.html _site/
          cp build.txt _site/ 2>/dev/null || true
          cp .nojekyll _site/ 2>/dev/null || true
          cp tunnel.txt _site/ 2>/dev/null || true
          ls -la _site

      - name: Preparer Pages
        uses: actions/configure-pages@v5

      - name: Empaqueter le site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deployer
        id: deployment
        uses: actions/deploy-pages@v4
