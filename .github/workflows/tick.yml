name: tick

# Temoin : le planificateur GitHub declenche-t-il vraiment ce depot ?
# Un job qui ne fait rien, toutes les 5 minutes. A supprimer une fois la reponse connue.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: echo "tick $(date -u +%FT%TZ)"
