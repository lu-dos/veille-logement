name: collect

# Collecte sans le PC : elle tourne sur le runner GitHub, qui n'a pas de navigateur
# mais a acces a l'API JSON de Bien'ici. Tant que le PC publie (heartbeat recent),
# le runner ne fait rien : c'est le PC qui collecte, avec plus de sources.
# Le runner deploie Pages lui-meme : un push fait avec GITHUB_TOKEN ne declenche
# pas le workflow "pages" (protection anti-recursion de GitHub).
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment_3.outputs.page_url || steps.deployment_2.outputs.page_url || steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Le PC est-il encore la ?
        id: hb
        run: |
          node ci/skip.mjs >> "$GITHUB_OUTPUT"

      - name: Collecte + rapport + notification
        if: steps.hb.outputs.skip == 'false'
        env:
          NO_BROWSER: '1'
          PUBLISH_LOCAL: '1'
          STATE_DIR: .state
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: node run.mjs

      - name: Enregistrer le resultat
        if: steps.hb.outputs.skip == 'false'
        run: |
          git config user.email "runner@veille-logement.invalid"
          git config user.name "veille-logement runner"
          git add -A
          if git diff --cached --quiet; then
            echo "rien de neuf"
            exit 0
          fi
          git commit -m "collecte sans PC $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            if git push origin HEAD:main; then
              echo "pousse"
              exit 0
            fi
            git pull --rebase --autostash origin main || git rebase --abort || true
            sleep 5
          done
          echo "echec du push apres 3 essais"
          exit 1

      - name: Preparer le dossier public
        if: steps.hb.outputs.skip == 'false'
        run: |
          mkdir -p _site
          cp index.html _site/
          cp build.txt _site/ 2>/dev/null || true
          cp .nojekyll _site/ 2>/dev/null || true
          cp tunnel.txt _site/ 2>/dev/null || true
          ls -la _site

      - name: Copie de secours (surge.sh)
        if: steps.hb.outputs.skip == 'false'
        continue-on-error: true
        env:
          SURGE_LOGIN: ${{ secrets.SURGE_LOGIN }}
          SURGE_TOKEN: ${{ secrets.SURGE_TOKEN }}
        run: npx --yes surge _site veille-logement-ludo.surge.sh

      - name: Preparer Pages
        if: steps.hb.outputs.skip == 'false'
        uses: actions/configure-pages@v5

      - name: Empaqueter le site
        id: upload
        if: steps.hb.outputs.skip == 'false'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      # Meme course que dans pages.yml : deploy-pages interroge l'API du run pour
      # retrouver l'artefact, qui n'y est pas toujours visible immediatement.
      # On patiente, puis on reessaie, plutot que d'echouer et d'envoyer un mail.
      - name: Attendre que l'artefact soit visible
        if: steps.hb.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "artefact ${{ steps.upload.outputs.artifact_id }}"
          for i in $(seq 1 12); do
            count=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=github-pages" \
              --jq '.total_count' 2>/dev/null) || { echo "API illisible, on tente le deploiement"; break; }
            if [ "$count" != "0" ] && [ -n "$count" ]; then
              echo "artefact visible apres $((i * 10 - 10))s"
              break
            fi
            sleep 10
          done

      - name: Deployer
        id: deployment
        if: steps.hb.outputs.skip == 'false'
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Attendre avant le 2e essai
        if: steps.hb.outputs.skip == 'false' && steps.deployment.outcome == 'failure'
        run: sleep 45

      - name: Deployer (2e essai)
        id: deployment_2
        if: steps.hb.outputs.skip == 'false' && steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Attendre avant le 3e essai
        if: steps.hb.outputs.skip == 'false' && steps.deployment.outcome == 'failure' && steps.deployment_2.outcome == 'failure'
        run: sleep 90

      - name: Deployer (3e essai)
        id: deployment_3
        if: steps.hb.outputs.skip == 'false' && steps.deployment.outcome == 'failure' && steps.deployment_2.outcome == 'failure'
        uses: actions/deploy-pages@v4
